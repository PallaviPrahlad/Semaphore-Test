- name: Check if IIS (W3SVC) service is installed
  ansible.windows.win_service_info:
    name: W3SVC
  register: iis_service_info

- name: Ensure Impersonate a client after authentication is without IIS_USRS
  community.windows.win_security_policy:
    section: Privilege Rights
    key: SeImpersonatePrivilege
    value: "*S-1-5-19,*S-1-5-20,*S-1-5-32-544,*S-1-5-6"
  when: iis_service_info.services | length == 0 or iis_service_info.services[0].state != 'running'

- name: Ensure Impersonate a client after authentication is set With IIS_IUSRS
  community.windows.win_security_policy:
    section: System Access
    key: SeImpersonatePrivilege
    value: Administrators, LOCAL SERVICE, NETWORK SERVICE, SERVICE, IIS_IUSRS
  when: iis_service_info.services | length > 0 and iis_service_info.services[0].state == 'running'

