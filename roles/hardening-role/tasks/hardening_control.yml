---
# roles/windows_hardening/tasks/main.yml

- name: Ensure password history is enforced
  community.windows.win_security_policy:
    section: System Access
    key: PasswordHistorySize
    value: 24

- name: Ensure minimum password age is set
  community.windows.win_security_policy:
    section: System Access
    key: MinimumPasswordAge
    value: 1

- name: Ensure maximum password age is set
  community.windows.win_security_policy:
    section: System Access
    key: MaximumPasswordAge
    value: 365

- name: Ensure minimum password length is set
  community.windows.win_security_policy:
    section: System Access
    key: MinimumPasswordLength
    value: 10

- name: Ensure password complexity is enabled
  community.windows.win_security_policy:
    section: System Access
    key: PasswordComplexity
    value: 1

- name: Relax minimum password length limits
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\SAM
    name: RelaxMinimumPasswordLengthLimits
    data: 1
    type: dword

#- name: Relax minimum password length limits
#  community.windows.win_security_policy:
