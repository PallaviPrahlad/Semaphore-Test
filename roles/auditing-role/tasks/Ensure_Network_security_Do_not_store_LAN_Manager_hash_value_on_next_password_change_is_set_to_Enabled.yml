---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network security Do not store LAN Manager hash value on next password change'
  set_fact:
    lanman_raw: "{{ (secpol_file.stdout | regex_search('NoLMHash\\s*=.*')) | default('NoLMHash=0') }}"

- name: Extract current value
  set_fact:
    current_lanman: "{{ (lanman_raw | regex_replace('.*=','') | trim | split(',') | last | int) }}"

# Values for NoLMHash:
# 0 = Disabled (FAILED)
# 1 = Enabled (PASSED)

- name: Decide audit result
  set_fact:
    audit_result_lanman: "{{ 'PASSED' if (current_lanman | int) == 1 else 'FAILED' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network security: Do not store LAN Manager hash value on next password change' on {{ inventory_hostname }}: {{ audit_result_lanman }} (Current value: {{ current_lanman }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV (numeric output, no quotes)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network security: Do not store LAN Manager hash value on next password change' is set to 'Enabled',{{ impact | default('High') }},{{ audit_result_lanman }},{{ current_lanman }},Enabled"
    create: yes
