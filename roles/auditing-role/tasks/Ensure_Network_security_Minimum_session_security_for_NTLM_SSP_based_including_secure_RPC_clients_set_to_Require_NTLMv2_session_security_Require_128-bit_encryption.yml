---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network security Minimum session security for NTLM SSP based (including secure RPC) clients'
  set_fact:
    ntlm_client_raw: "{{ (secpol_file.stdout | regex_search('NTLMMinClientSec\\s*=.*')) | default('NTLMMinClientSec=0') }}"

- name: Extract current value
  set_fact:
    current_ntlm_client: "{{ (ntlm_client_raw | regex_replace('.*=','') | trim | split(',') | last | int) }}"

# Values for NTLMMinClientSec:
# Bitmask flags normally: 16 (NTLMv2), 32 (128-bit) → 48
# Some environments export decimal 537395200 for the same requirement
# Treat both 48 and 537395200 as compliant

- name: Decide audit result
  set_fact:
    audit_result_ntlm_client: "{{ 'PASSED' if (current_ntlm_client | int) in [48, 537395200] else 'FAILED' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network security: Minimum session security for NTLM SSP based (including secure RPC) clients' on {{ inventory_hostname }}: {{ audit_result_ntlm_client }} (Current value: {{ current_ntlm_client }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV (numeric output, no quotes)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network security: Minimum session security for NTLM SSP based (including secure RPC) clients' is set to 'Require NTLMv2 session security, Require 128-bit encryption',{{ impact | default('High') }},{{ audit_result_ntlm_client }},{{ current_ntlm_client }},48_or_537395200"
    create: yes
