---
- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Change the time zone'
  set_fact:
    change_time_zone: "{{ (secpol_file.stdout | regex_search('SeTimeZonePrivilege\\s*=.*')) | regex_replace('.*=','') | trim }}"

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% set expected = ['*S-1-5-32-544','*S-1-5-19'] %}
      {% set current = change_time_zone.split(',') | map('trim') | list %}
      {% if current | difference(expected) | length == 0 and expected | difference(current) | length == 0 %}
      PASSED
      {% else %}
      FAILED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for 'Change the time zone' on {{ inventory_hostname }}: {{ audit_result }} (Current value: {{ change_time_zone | default('None') }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Change the time zone' is set to 'Administrators, LOCAL SERVICE',{{ impact }},{{ audit_result }},{{ change_time_zone | default('N/A') }},*S-1-5-32-544,*S-1-5-19"
    create: yes

