---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network security Restrict NTLM Audit Incoming NTLM Traffic'
  set_fact:
    ntlm_incoming_raw: "{{ (secpol_file.stdout | regex_search('AuditNTLMInDomain\\s*=.*')) | default('AuditNTLMInDomain=0') }}"

- name: Extract current value
  set_fact:
    current_ntlm_incoming: "{{ (ntlm_incoming_raw | regex_replace('.*=','') | trim | split(',') | last | int) }}"

# Values for AuditNTLMInDomain:
# 0 = Disabled (non-compliant)
# 1 = Enable auditing for domain accounts only (partial compliance)
# 2 = Enable auditing for all accounts (compliant)

- name: Decide audit result
  set_fact:
    audit_result_ntlm_incoming: "{{ 'PASSED' if (current_ntlm_incoming | int) == 2 else 'FAILED' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network security: Restrict NTLM: Audit Incoming NTLM Traffic' on {{ inventory_hostname }}: {{ audit_result_ntlm_incoming }} (Current value: {{ current_ntlm_incoming }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV (numeric output, no quotes)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network security: Restrict NTLM: Audit Incoming NTLM Traffic' is set to 'Enable auditing for all accounts',{{ impact | default('High') }},{{ audit_result_ntlm_incoming }},{{ current_ntlm_incoming }},2"
    create: yes
