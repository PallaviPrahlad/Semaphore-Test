---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Deny log on as a batch job'
  set_fact:
    deny_batch_raw: "{{ (secpol_file.stdout | regex_search('SeDenyBatchLogonRight\\s*=.*')) | default('SeDenyBatchLogonRight=') }}"

- name: Extract accounts into current list
  set_fact:
    current: "{{ deny_batch_raw | regex_replace('.*=','') | trim | split(',') | map('trim') | list }}"

# Pass only if Guest SID is present
- name: Decide audit result
  set_fact:
    audit_result: >-
      {% if '*S-1-5-32-546' in current %}
      PASSED
      {% else %}
      FAILED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for 'Deny log on as a batch job' on {{ inventory_hostname }}: {{ audit_result }} (Current accounts: {{ current | default([]) }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Deny log on as a batch job' includes 'Guests',{{ impact }},{{ audit_result }},{{ current | join(';') | default('N/A') }},Guests"
    create: yes
