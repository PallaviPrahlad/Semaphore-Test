---
- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Deny log on as a service'
  set_fact:
    deny_service_raw: "{{ (secpol_file.stdout | regex_search('SeDenyServiceLogonRight=.*')) | default('SeDenyServiceLogonRight=') }}"

- name: Extract value after '='
  set_fact:
    deny_service: "{{ deny_service_raw | regex_replace('.*=','') | trim }}"

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% set expected = ['*S-1-5-32-546'] %}   # Guests SID
      {% set current = deny_service.split(',') | map('trim') | list if deny_service != '' else [] %}
      {% if expected | difference(current) | length == 0 %}
      PASSED
      {% else %}
      FAILED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for 'Deny log on as a service' on {{ inventory_hostname }}: {{ audit_result }} (Current value: {{ deny_service | default('None') }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Deny log on as a service' includes 'Guests',{{ impact }},{{ audit_result }},{{ deny_service | default('N/A') }},Guests"
    create: yes

