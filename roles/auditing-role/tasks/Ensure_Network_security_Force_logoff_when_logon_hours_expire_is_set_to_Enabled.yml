---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network security Force logoff when logon hours expire'
  set_fact:
    force_logoff_raw: "{{ (secpol_file.stdout | regex_search('ForceLogoffWhenHourExpire\\s*=.*')) | default('ForceLogoffWhenHourExpire=0') }}"

- name: Extract current value
  set_fact:
    current_force_logoff: "{{ (force_logoff_raw | regex_replace('.*=','') | trim | split(',') | last | int) }}"

# Values for ForceLogoffWhenHourExpire:
# 0 = Disabled (FAILED)
# 1 = Enabled (PASSED)

- name: Decide audit result
  set_fact:
    audit_result_force_logoff: "{{ 'PASSED' if (current_force_logoff | int) == 1 else 'FAILED' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network security: Force logoff when logon hours expire' on {{ inventory_hostname }}: {{ audit_result_force_logoff }} (Current value: {{ current_force_logoff }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV (numeric output, no quotes)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network security: Force logoff when logon hours expire' is set to 'Enabled',{{ impact | default('High') }},{{ audit_result_force_logoff }},{{ current_force_logoff }},Enabled"
    create: yes
