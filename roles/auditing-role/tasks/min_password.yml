---
- name: Get Minimum password length using net accounts
  win_command: net accounts
  register: net_accounts_output

- name: Parse Minimum password length
  set_fact:
    min_password_length: >-
      {{ (net_accounts_output.stdout_lines
          | select('search', 'Minimum password length')
          | list
          | first).split(':')[1]
          | regex_replace('[^0-9]', '')
          | int }}

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% if (min_password_length | int) < 14 %}
      FAILED
      {% else %}
      PASSED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for Minimum password length on {{ inventory_hostname }}: {{ audit_result }} (Current value: {{ min_password_length }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Minimum password length' is set to '14 or more character(s)',{{ impact }},{{ audit_result }},{{ min_password_length | default('N/A') }},14 or more characters"
    create: yes

