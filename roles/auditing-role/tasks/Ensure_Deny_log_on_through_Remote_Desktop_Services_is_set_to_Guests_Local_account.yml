---
- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Deny log on through Remote Desktop Services'
  set_fact:
    deny_rds_raw: "{{ (secpol_file.stdout | regex_search('SeDenyRemoteInteractiveLogonRight\\s*=.*')) | default('SeDenyRemoteInteractiveLogonRight=') }}"

- name: Extract accounts into current list
  set_fact:
    current: "{{ deny_rds_raw | regex_replace('.*=','') | trim | split(',') | map('trim') | list }}"

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% set expected = ['*S-1-5-32-546','*S-1-5-113'] %}   # Guests + Local account
      {% if current | difference(expected) | length == 0 and expected | difference(current) | length == 0 %}
      PASSED
      {% else %}
      FAILED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for 'Deny log on through Remote Desktop Services' on {{ inventory_hostname }}: {{ audit_result }} (Current accounts: {{ current | default([]) }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Deny log on through Remote Desktop Services' is set to 'Guests, Local account',{{ impact }},{{ audit_result }},{{ current | join(';') | default('N/A') }},Guests,Local account"
    create: yes

