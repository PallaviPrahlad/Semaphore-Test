---
- name: Get domain password policy
  win_powershell:
    script: |
      Import-Module ActiveDirectory
      $policy = Get-ADDefaultDomainPasswordPolicy
      if ($policy.ComplexityEnabled -eq $true) {
        Write-Output "Enabled"
      } else {
        Write-Output "Disabled"
      }
  register: complexity_output

- name: Parse password complexity
  set_fact:
    password_complexity: "{{ complexity_output.stdout | trim }}"

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% if password_complexity == 'Enabled' %}
      PASSED
      {% elif password_complexity == 'Disabled' %}
      FAILED
      {% else %}
      UNKNOWN
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for Password complexity on {{ inventory_hostname }}: {{ audit_result }} (Current value: {{ password_complexity }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/password_complexity_audit.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/password_complexity_audit.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Password must meet complexity requirements' is set to 'Enabled',{{ impact }},{{ audit_result }},{{ password_complexity | default('N/A') }},Enabled"
    create: yes

