---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network Security Allow PKU2U authentication requests to this computer to use online identities'
  set_fact:
    pku2u_raw: "{{ (secpol_file.stdout | regex_search('AllowPKU2UAuthenticationRequests\\s*=.*')) | default('AllowPKU2UAuthenticationRequests=1') }}"

- name: Extract current value
  set_fact:
    current_pku2u: "{{ (pku2u_raw | regex_replace('.*=','') | trim | split(',') | last | int) }}"

# Values for AllowPKU2UAuthenticationRequests:
# 0 = Disabled (PASSED)
# 1 = Enabled (FAILED)

- name: Decide audit result
  set_fact:
    audit_result_pku2u: "{{ 'PASSED' if (current_pku2u | int) == 0 else 'FAILED' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network Security: Allow PKU2U authentication requests to this computer to use online identities' on {{ inventory_hostname }}: {{ audit_result_pku2u }} (Current value: {{ current_pku2u }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV (numeric output, no quotes)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network Security: Allow PKU2U authentication requests to this computer to use online identities' is set to 'Disabled',{{ impact | default('High') }},{{ audit_result_pku2u }},{{ current_pku2u }},Disabled"
    create: yes
