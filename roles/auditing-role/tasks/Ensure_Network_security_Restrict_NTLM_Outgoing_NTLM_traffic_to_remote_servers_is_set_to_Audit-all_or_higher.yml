---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network security Restrict NTLM: Outgoing NTLM traffic to remote servers'
  set_fact:
    ntlm_outgoing_raw: "{{ (secpol_file.stdout | regex_search('RestrictSendingNTLMTraffic\\s*=.*')) | default('RestrictSendingNTLMTraffic=0') }}"

- name: Extract current value
  set_fact:
    current_ntlm_outgoing: "{{ (ntlm_outgoing_raw | regex_replace('.*=','') | trim | split(',') | last | int) }}"

# Values for RestrictSendingNTLMTraffic:
# 0 = Disabled (non-compliant)
# 1 = Allow all (non-compliant)
# 2 = Audit all (compliant)
# 3 = Deny all (compliant, stricter than audit)

- name: Decide audit result
  set_fact:
    audit_result_ntlm_outgoing: "{{ 'PASSED' if (current_ntlm_outgoing | int) >= 2 else 'FAILED' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network security: Restrict NTLM: Outgoing NTLM traffic to remote servers' on {{ inventory_hostname }}: {{ audit_result_ntlm_outgoing }} (Current value: {{ current_ntlm_outgoing }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV (numeric output, no quotes)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network security: Restrict NTLM: Outgoing NTLM traffic to remote servers' is set to 'Audit all or higher',{{ impact | default('High') }},{{ audit_result_ntlm_outgoing }},{{ current_ntlm_outgoing }},Audit all or higher"
    create: yes
