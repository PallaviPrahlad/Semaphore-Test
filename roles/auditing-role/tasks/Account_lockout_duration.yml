---
- name: Get account lockout duration
  win_command: net accounts
  register: net_accounts_output

- name: Parse account lockout duration
  set_fact:
    lockout_duration: >-
      {{ (net_accounts_output.stdout_lines
          | select('search', 'Lockout duration')
          | list
          | first).split(':')[1]
          | regex_replace('[^0-9]', '')
          | int }}

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% if (lockout_duration | int) < 15 %}
      FAILED
      {% else %}
      PASSED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for Account lockout duration on {{ inventory_hostname }}: {{ audit_result }} (Current value: {{ lockout_duration }} minutes)"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Account lockout duration' is set to '15 or more minute(s)',{{ impact }},{{ audit_result }},{{ lockout_duration | default('N/A') }},15 or more minutes"
    create: yes

