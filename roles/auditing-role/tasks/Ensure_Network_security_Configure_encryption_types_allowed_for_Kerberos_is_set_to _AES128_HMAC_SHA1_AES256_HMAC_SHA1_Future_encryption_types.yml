---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network security Configure encryption types allowed for Kerberos'
  set_fact:
    kerberos_raw: "{{ (secpol_file.stdout | regex_search('SupportedEncryptionTypes\\s*=.*')) | default('SupportedEncryptionTypes=0') }}"

- name: Extract current value
  set_fact:
    current_kerberos: "{{ (kerberos_raw | regex_replace('.*=','') | trim | split(',') | last) }}"

# Expected numeric value for SupportedEncryptionTypes:
# 2147483640 = AES128_HMAC_SHA1, AES256_HMAC_SHA1, Future encryption types

- name: Decide audit result
  set_fact:
    audit_result_kerberos: "{{ 'PASSED' if (current_kerberos | int) == 2147483640 else 'FAILED' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network security: Configure encryption types allowed for Kerberos' on {{ inventory_hostname }}: {{ audit_result_kerberos }} (Current value: {{ current_kerberos }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV (numeric output, no quotes)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network security: Configure encryption types allowed for Kerberos' is set to 'AES128_HMAC_SHA1, AES256_HMAC_SHA1, Future encryption types',{{ impact | default('High') }},{{ audit_result_kerberos }},{{ current_kerberos }},2147483640"
    create: yes
