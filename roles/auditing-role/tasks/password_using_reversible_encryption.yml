---
- name: Get reversible encryption setting
  ansible.windows.win_powershell:
    script: |
      Import-Module ActiveDirectory
      $policy = Get-ADDefaultDomainPasswordPolicy
      if ($policy.ReversibleEncryptionEnabled -eq $true) {
        Write-Output "Enabled"
      } else {
        Write-Output "Disabled"
      }
  register: reversible_output

- name: Parse reversible encryption setting
  set_fact:
    reversible_encryption: "{{ reversible_output.output | first | default('UNKNOWN') | trim }}"

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% if reversible_encryption == 'Disabled' %}
      PASSED
      {% elif reversible_encryption == 'Enabled' %}
      FAILED
      {% else %}
      UNKNOWN
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for Store passwords using reversible encryption on {{ inventory_hostname }}: {{ audit_result }} (Current value: {{ reversible_encryption }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Store passwords using reversible encryption' is set to 'Disabled',{{ impact }},{{ audit_result }},{{ reversible_encryption | default('N/A') }},Disabled"
    create: yes

