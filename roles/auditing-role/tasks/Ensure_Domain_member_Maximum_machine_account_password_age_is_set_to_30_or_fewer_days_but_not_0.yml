---
- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Domain member Maximum machine account password age'
  set_fact:
    max_pwd_age_raw: "{{ (secpol_file.stdout | regex_search('MaximumPasswordAge\\s*=.*')) | default('MaximumPasswordAge=') }}"

- name: Extract current value
  set_fact:
    current: "{{ max_pwd_age_raw | regex_replace('.*=','') | trim }}"

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% set age = current | int %}
      {% if age == 0 %}
      FAILED
      {% elif age > 30 %}
      FAILED
      {% else %}
      PASSED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for 'Domain member: Maximum machine account password age' on {{ inventory_hostname }}: {{ audit_result }} (Current value: {{ current | default('N/A') }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Domain member: Maximum machine account password age' is set to '30 or fewer days but not 0',{{ impact }},{{ audit_result }},{{ current | default('N/A') }},30 or fewer days (not 0)"
    create: yes

