---
- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Impersonate a client after authentication'
  set_fact:
    impersonate_raw: "{{ (secpol_file.stdout | regex_search('SeImpersonatePrivilege\\s*=.*')) | default('SeImpersonatePrivilege=') }}"

- name: Extract accounts into current list
  set_fact:
    current: "{{ impersonate_raw | regex_replace('.*=','') | trim | split(',') | map('trim') | list }}"

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% set expected_base = ['*S-1-5-19','*S-1-5-20','*S-1-32-544','*S-1-5-6'] %}   # Administrators, LOCAL SERVICE, NETWORK SERVICE, SERVICE
      {% set expected_iis = expected_base + ['IIS_IUSRS'] %}
      {% if current | difference(expected_base) | length == 0 and expected_base | difference(current) | length == 0 %}
      PASSED
      {% elif current | difference(expected_iis) | length == 0 and expected_iis | difference(current) | length == 0 %}
      PASSED
      {% else %}
      FAILED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for 'Impersonate a client after authentication' on {{ inventory_hostname }}: {{ audit_result }} (Current accounts: {{ current | default([]) }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Impersonate a client after authentication' is set to 'Administrators-LOCAL SERVICE-NETWORK SERVICE-SERVICE' (and IIS_IUSRS if IIS installed),{{ impact }},{{ audit_result }},{{ current | join(';') | default('N/A') }},Administrators-LOCAL SERVICE-NETWORK SERVICE-SERVICE"
    create: yes

