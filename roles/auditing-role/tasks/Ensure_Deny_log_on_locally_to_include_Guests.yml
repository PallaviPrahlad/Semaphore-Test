---
- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Deny log on locally'
  set_fact:
    deny_locally_raw: "{{ (secpol_file.stdout | regex_search('SeDenyInteractiveLogonRight\\s*=.*')) | default('SeDenyInteractiveLogonRight=') }}"

- name: Extract accounts into current list
  set_fact:
    current: "{{ deny_locally_raw | regex_replace('.*=','') | trim | split(',') | map('trim') | list }}"

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% set expected = ['*S-1-5-32-546'] %}   # Guests SID
      {% if current | difference(expected) | length == 0 and expected | difference(current) | length == 0 %}
      PASSED
      {% else %}
      FAILED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for 'Deny log on locally' on {{ inventory_hostname }}: {{ audit_result }} (Current accounts: {{ current | default([]) }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Deny log on locally' includes only 'Guests',{{ impact }},{{ audit_result }},{{ current | join(';') | default('N/A') }},Guests"
    create: yes 
