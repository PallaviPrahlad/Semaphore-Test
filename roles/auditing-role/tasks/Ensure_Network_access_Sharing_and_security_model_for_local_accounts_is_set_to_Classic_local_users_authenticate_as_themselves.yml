---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network access Sharing and security model for local accounts'
  set_fact:
    local_accounts_raw: "{{ (secpol_file.stdout | regex_search('ForceGuest\\s*=.*')) | default('ForceGuest=1') }}"

- name: Extract current values list
  set_fact:
    current_local_accounts_list: "{{ (local_accounts_raw | regex_replace('.*=','') | trim | split(',') | map('trim')) }}"

- name: Normalize current value (take last numeric entry)
  set_fact:
    current_local_accounts: "{{ (current_local_accounts_list | last | int) }}"

# Values for ForceGuest:
# 0 = Classic - local users authenticate as themselves (compliant)
# 1 = Guest only - local users authenticate as Guest (non-compliant)

- name: Decide audit result
  set_fact:
    audit_result_local_accounts: "{{ 'PASSED' if current_local_accounts == 0 else 'FAILED' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network access: Sharing and security model for local accounts' on {{ inventory_hostname }}: {{ audit_result_local_accounts }} (Raw value: {{ current_local_accounts_list }}, Effective value: {{ current_local_accounts }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network access: Sharing and security model for local accounts' is set to 'Classic - local users authenticate as themselves',{{ impact | default('High') }},{{ audit_result_local_accounts }},{{ current_local_accounts }},Classic"
    create: yes
