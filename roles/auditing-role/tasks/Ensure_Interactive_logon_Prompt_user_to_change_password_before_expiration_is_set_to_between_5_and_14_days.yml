---
- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Interactive logon Prompt user to change password before expiration'
  set_fact:
    prompt_pwd_change_raw: "{{ (secpol_file.stdout | regex_search('PasswordExpiryWarning\\s*=.*')) | default('PasswordExpiryWarning=') }}"

- name: Extract current value
  set_fact:
    current: "{{ prompt_pwd_change_raw | regex_replace('.*=','') | trim }}"

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% if '5' in current %}
      PASSED
      {% else %}
      FAILED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for 'Interactive logon: Prompt user to change password before expiration' on {{ inventory_hostname }}: {{ audit_result }} (Current value: {{ current | default('N/A') }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Interactive logon: Prompt user to change password before expiration' is set to 'between 5 and 14 days',{{ impact }},{{ audit
