  tasks:
    - name: Get Maximum password age using net accounts
      win_command: net accounts
      register: net_accounts_output

    - name: Parse Maximum password age
      set_fact:
        max_password_age: >-
          {{ (net_accounts_output.stdout_lines
              | select('search', 'Maximum password age')
              | list
              | first).split(':')[1]
              | regex_replace('[^0-9]', '')
              | int }}

    - name: Decide audit result
      set_fact:
        audit_result: >-
          {% if (max_password_age | int) == 0 %}
          FAILED
          {% elif (max_password_age | int) > 365 %}
          FAILED
          {% else %}
          PASSED
          {% endif %}

    - name: Display audit result
      debug:
        msg: "Audit result for Maximum password age on {{ inventory_hostname }}: {{ audit_result }} (Current value: {{ max_password_age }})"

    - name: Add header row to CSV (only once)
      local_action:
        module: lineinfile
        path: /tmp/test.csv
        line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
        create: yes
        insertafter: BOF
      run_once: true
    
    - name: Write audit result to CSV
      local_action:
        module: lineinfile
        path: /tmp/test.csv
        line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Maximum password age' is set to '365 or fewer days, but not 0',{{ impact }},{{ audit_result }},{{ max_password_age | default('N/A') }},365 or fewer days (not 0)"
        create: yes

