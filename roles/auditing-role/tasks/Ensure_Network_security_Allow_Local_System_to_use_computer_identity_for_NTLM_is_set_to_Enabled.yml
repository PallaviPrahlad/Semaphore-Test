---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network security Allow Local System to use computer identity for NTLM'
  set_fact:
    ntlm_identity_raw: "{{ (secpol_file.stdout | regex_search('UseMachineId\\s*=.*')) | default('UseMachineId=0') }}"

- name: Extract current value
  set_fact:
    current_ntlm_identity: "{{ (ntlm_identity_raw | regex_replace('.*=','') | trim | split(',') | last | int) }}"

# Values for UseMachineId:
# 0 = Disabled (non-compliant)
# 1 = Enabled (compliant)

- name: Decide audit result
  set_fact:
    audit_result_ntlm_identity: "{{ 'COMPLIANT' if (current_ntlm_identity | int) == 1 else 'NON-COMPLIANT' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network security: Allow Local System to use computer identity for NTLM' on {{ inventory_hostname }}: {{ audit_result_ntlm_identity }} (Current value: {{ current_ntlm_identity }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV (numeric output, no quotes)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network security: Allow Local System to use computer identity for NTLM' is set to 'Enabled',{{ impact | default('High') }},{{ audit_result_ntlm_identity }},{{ current_ntlm_identity }},Enabled"
    create: yes
