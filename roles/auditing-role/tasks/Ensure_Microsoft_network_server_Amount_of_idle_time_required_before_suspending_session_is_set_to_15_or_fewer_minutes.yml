---
- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Microsoft network server Amount of idle time required before suspending session'
  set_fact:
    idle_time_raw: "{{ (secpol_file.stdout | regex_search('AutoDisconnect\\s*=.*')) | default('AutoDisconnect=') }}"

- name: Extract current value (take last number if multiple)
  set_fact:
    current: "{{ (idle_time_raw | regex_replace('.*=','') | trim | split(',') | last | int) }}"

# AutoDisconnect is numeric (minutes). Compliant if <= 15.

- name: Decide audit result
  set_fact:
    audit_result: "{{ 'PASSED' if (current | int) <= 15 else 'FAILED' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Microsoft network server: Amount of idle time required before suspending session' on {{ inventory_hostname }}: {{ audit_result }} (Current value: {{ current }} minute(s))"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV (numeric output, no quotes)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Microsoft network server: Amount of idle time required before suspending session' is set to '15 or fewer minute(s)',{{ impact }},{{ audit_result }},{{ current }},15 or fewer minute(s)"
    create: yes

