---
- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Create global objects'
  set_fact:
    create_global_objects: "{{ (secpol_file.stdout | regex_search('SeCreateGlobalPrivilege\\s*=.*')) | regex_replace('.*=','') | trim }}"

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% set expected = ['*S-1-5-32-544','*S-1-5-19','*S-1-5-20','*S-1-5-6'] %}
      {% set current = create_global_objects.split(',') | map('trim') | list %}
      {% if current | difference(expected) | length == 0 and expected | difference(current) | length == 0 %}
      PASSED
      {% else %}
      FAILED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for 'Create global objects' on {{ inventory_hostname }}: {{ audit_result }} (Current value: {{ create_global_objects | default('None') }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Create global objects' is set to 'Administrators, LOCAL SERVICE, NETWORK SERVICE, SERVICE',{{ impact }},{{ audit_result }},{{ create_global_objects | default('N/A') }},Administrators, LOCAL SERVICE, NETWORK SERVICE, SERVICE"
    create: yes

