---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network access Restrict clients allowed to make remote calls to SAM'
  set_fact:
    sam_remote_raw: "{{ (secpol_file.stdout | regex_search('SceNoRemoteSamClients\\s*=.*')) | default('SceNoRemoteSamClients=') }}"

- name: Extract current value
  set_fact:
    current_sam_remote: "{{ (sam_remote_raw | regex_replace('.*=','') | trim) }}"

# Expected value for compliance:
# Administrators: Remote Access: Allow

- name: Decide audit result
  set_fact:
    audit_result_sam_remote: "{{ 'PASSED' if current_sam_remote == 'O:BAG:BAD:(A;;RC;;;BA)' else 'FAILED' }}"

# Note: The SID string 'O:BAG:BAD:(A;;RC;;;BA)' corresponds to "Administrators: Remote Access: Allow"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network access Restrict clients allowed to make remote calls to SAM' on {{ inventory_hostname }}: {{ audit_result_sam_remote }} (Current value: {{ current_sam_remote }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network access: Restrict clients allowed to make remote calls to SAM' is set to 'Administrators: Remote Access: Allow (MS only)',{{ impact | default('High') }},{{ audit_result_sam_remote }},{{ current_sam_remote }},Administrators: Remote Access: Allow"
    create: yes
