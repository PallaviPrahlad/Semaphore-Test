---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network access Restrict anonymous access to Named Pipes and Shares'
  set_fact:
    restrict_anonymous_raw: "{{ (secpol_file.stdout | regex_search('RestrictAnonymous\\s*=.*')) | default('RestrictAnonymous=0') }}"

- name: Extract current value
  set_fact:
    current_restrict_anonymous: "{{ (restrict_anonymous_raw | regex_replace('.*=','') | trim | split(',') | last | int) }}"

# Values for RestrictAnonymous:
# 0 = Disabled (non-compliant)
# 1 = Enabled (compliant)

- name: Decide audit result
  set_fact:
    audit_result_restrict_anonymous: "{{ 'PASSED' if (current_restrict_anonymous | int) == 1 else 'FAILED' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network access: Restrict anonymous access to Named Pipes and Shares' on {{ inventory_hostname }}: {{ audit_result_restrict_anonymous }} (Current value: {{ current_restrict_anonymous }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV (numeric output, no quotes)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network access: Restrict anonymous access to Named Pipes and Shares' is set to 'Enabled',{{ impact | default('High') }},{{ audit_result_restrict_anonymous }},{{ current_restrict_anonymous }},Enabled"
    create: yes
