---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network security LDAP client signing requirements'
  set_fact:
    ldap_signing_raw: "{{ (secpol_file.stdout | regex_search('LDAPClientIntegrity\\s*=.*')) | default('LDAPClientIntegrity=0') }}"

- name: Extract current value
  set_fact:
    current_ldap_signing: "{{ (ldap_signing_raw | regex_replace('.*=','') | trim | split(',') | last | int) }}"

# Values for LDAPClientIntegrity:
# 0 = None (non-compliant)
# 1 = Negotiate signing (compliant)
# 2 = Require signing (compliant)

- name: Decide audit result
  set_fact:
    audit_result_ldap_signing: "{{ 'PASSED' if (current_ldap_signing | int) >= 1 else 'FAILED' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network security: LDAP client signing requirements' on {{ inventory_hostname }}: {{ audit_result_ldap_signing }} (Current value: {{ current_ldap_signing }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV (numeric output, no quotes)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network security: LDAP client signing requirements' is set to 'Negotiate signing' or higher,{{ impact | default('High') }},{{ audit_result_ldap_signing }},{{ current_ldap_signing }},Negotiate_or_higher"
    create: yes
