---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network access Shares that can be accessed anonymously'
  set_fact:
    anon_shares_raw: "{{ (secpol_file.stdout | regex_search('NullSessionShares\\s*=.*')) | default('NullSessionShares=') }}"

- name: Extract current value
  set_fact:
    current_anon_shares: "{{ (anon_shares_raw | regex_replace('.*=','') | trim) }}"

# Expected value:
# None → represented as empty string after '=' in secedit export

- name: Decide audit result
  set_fact:
    audit_result_anon_shares: "{{ 'PASSED' if current_anon_shares == '' else 'FAILED' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network access Shares that can be accessed anonymously' on {{ inventory_hostname }}: {{ audit_result_anon_shares }} (Current value: {{ current_anon_shares | default('None') }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network access: Shares that can be accessed anonymously' is set to 'None',{{ impact | default('High') }},{{ audit_result_anon_shares }},{{ current_anon_shares | default('None') }},None"
    create: yes
