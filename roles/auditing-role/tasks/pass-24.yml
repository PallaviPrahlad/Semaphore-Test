# roles/auditing-role/tasks/main.yml
- name: Get current password history setting
  win_shell: net accounts
  register: net_accounts_output

- name: Show raw output
  debug:
    var: net_accounts_output.stdout_lines

- name: Check if password history is 24 or more
  win_shell: |
    $output = net accounts | Out-String
    $output = $output -replace "`r","" -replace "`n",""
    if ($output -match "Length of password history maintained: \s+(\d+)") {
        $value = [int]($matches[1])
        if ($value -ge 24) {
            Write-Output "Passed,$value"
        } else {
            Write-Output "Failed,$value"
        }
    } else {
        Write-Output "UNKNOWN,0"
    }
  register: compliance_check

- name: Parse compliance result
  set_fact:
    audit_result: "{{ compliance_check.stdout | trim | split(',')[0] }}"
    history_value: "{{ compliance_check.stdout | trim | split(',')[1] | default('N/A') }}"
    impact: "1"
    env: "Production"
    expected_value_pw_history: "24"

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Enforce password history' is set to '24 or more',{{ impact }},{{ audit_result }},{{ history_value }},{{ expected_value_pw_history }}"
    create: yes

