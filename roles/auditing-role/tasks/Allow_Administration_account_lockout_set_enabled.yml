---
- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Allow Administrator account lockout'
  set_fact:
    admin_lockout: >-
      {{ (secpol_file.stdout_lines
          | select('search', 'AllowAdministratorLockout')
          | list
          | first
          | regex_replace('.*=','')
          | trim }}

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% if admin_lockout == "1" %}
      PASSED
      {% else %}
      FAILED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for 'Allow Administrator account lockout' on {{ inventory_hostname }}: {{ audit_result }} (Current value: {{ admin_lockout }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Allow Administrator account lockout' is set to 'Enabled' (MS only),{{ impact }},{{ audit_result }},{{ admin_lockout | default('N/A') }},Enabled"
    create: yes

