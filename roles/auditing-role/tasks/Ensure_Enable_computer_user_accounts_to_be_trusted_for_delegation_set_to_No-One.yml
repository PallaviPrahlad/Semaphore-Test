---
- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Enable computer and user accounts to be trusted for delegation'
  set_fact:
    trusted_for_delegation: "{{ (secpol_file.stdout | regex_search('SeEnableDelegationPrivilege\\s*=.*')) | regex_replace('.*=','') | trim }}"

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% if (trusted_for_delegation is not defined) or (trusted_for_delegation | trim == "") %}
      PASSED
      {% else %}
      FAILED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for 'Enable computer and user accounts to be trusted for delegation' on {{ inventory_hostname }}: {{ audit_result }} (Current value: {{ trusted_for_delegation | default('None') }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Enable computer and user accounts to be trusted for delegation' is set to 'No One',{{ impact }},{{ audit_result }},{{ trusted_for_delegation | default('N/A') }},No One"
    create: yes

