---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network security LAN Manager authentication level'
  set_fact:
    lanman_auth_raw: "{{ (secpol_file.stdout | regex_search('LmCompatibilityLevel\\s*=.*')) | default('LmCompatibilityLevel=0') }}"

- name: Extract current value
  set_fact:
    current_lanman_auth: "{{ (lanman_auth_raw | regex_replace('.*=','') | trim | split(',') | last | int) }}"

# Values for LmCompatibilityLevel:
# 5 = Send NTLMv2 response only. Refuse LM & NTLM (PASSED)
# Other values = FAILED

- name: Decide audit result
  set_fact:
    audit_result_lanman_auth: "{{ 'PASSED' if (current_lanman_auth | int) == 5 else 'FAILED' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network security: LAN Manager authentication level' on {{ inventory_hostname }}: {{ audit_result_lanman_auth }} (Current value: {{ current_lanman_auth }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV (numeric output, no quotes)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network security: LAN Manager authentication level' is set to 'Send NTLMv2 response only. Refuse LM & NTLM',{{ impact | default('High') }},{{ audit_result_lanman_auth }},{{ current_lanman_auth }},5"
    create: yes
