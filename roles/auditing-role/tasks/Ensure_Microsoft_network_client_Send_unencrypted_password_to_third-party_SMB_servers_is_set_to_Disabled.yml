---
- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Microsoft network client: Send unencrypted password to third-party SMB servers'
  set_fact:
    unencrypted_pwd_raw: "{{ (secpol_file.stdout | regex_search('EnablePlainTextPassword\\s*=.*')) | default('EnablePlainTextPassword=') }}"

- name: Extract current values into list
  set_fact:
    current: "{{ unencrypted_pwd_raw | regex_replace('.*=','') | trim | split(',') | map('trim') | list }}"

# Values for EnablePlainTextPassword:
# 0 = Disabled (compliant)
# 1 = Enabled (non-compliant)

- name: Decide audit result
  set_fact:
    audit_result: >-
      {% if '0' in current %}
      PASSED
      {% else %}
      FAILED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for 'Microsoft network client: Send unencrypted password to third-party SMB servers' on {{ inventory_hostname }}: {{ audit_result }} (Current values: {{ current | default([]) }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Microsoft network client: Send unencrypted password to third-party SMB servers' is set to 'Disabled',{{ impact }},{{ audit_result }},{{ current | join(';') | default('N/A') }},Disabled"
    create: yes

