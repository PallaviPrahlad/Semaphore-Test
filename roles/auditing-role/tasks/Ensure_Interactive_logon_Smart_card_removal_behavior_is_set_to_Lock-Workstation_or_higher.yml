---
- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Interactive logon: Smart card removal behavior'
  set_fact:
    smartcard_removal_raw: "{{ (secpol_file.stdout | regex_search('ScRemoveOption\\s*=.*')) | default('ScRemoveOption=') }}"

- name: Extract current value (keep as string)
  set_fact:
    current: "{{ smartcard_removal_raw | regex_replace('.*=','') | trim }}"

# Values for ScRemoveOption:
# 0 = No Action (non-compliant)
# 1 = Lock Workstation (compliant)
# 2 = Force Logoff (compliant)
# 3 = Disconnect if Remote Terminal Services Session (compliant)

- name: Decide audit result (cast inside comparison)
  set_fact:
    audit_result: >-
      {% if (current | int) >= 1 %}
      PASSED
      {% else %}
      FAILED
      {% endif %}

- name: Display audit result
  debug:
    msg: "Audit result for 'Interactive logon: Smart card removal behavior' on {{ inventory_hostname }}: {{ audit_result }} (Current value: {{ current | default('N/A') }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV (no quotes around int)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env }},Ensure 'Interactive logon: Smart card removal behavior' is set to 'Lock Workstation' or higher,{{ impact }},{{ audit_result }},{{ current | int }},Lock Workstation or higher"
    create: yes

