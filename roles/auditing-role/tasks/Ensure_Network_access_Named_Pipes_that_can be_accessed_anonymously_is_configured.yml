---
# roles/audit/tasks/main.yml

- name: Export local security policy
  win_command: secedit /export /cfg C:\Windows\Temp\secpol.cfg

- name: Read exported security policy
  win_shell: type C:\Windows\Temp\secpol.cfg
  register: secpol_file

- name: Parse 'Network access: Named Pipes that can be accessed anonymously'
  set_fact:
    named_pipes_raw: "{{ (secpol_file.stdout | regex_search('NullSessionPipes\\s*=.*')) | default('NullSessionPipes=') }}"

- name: Extract current value
  set_fact:
    current_named_pipes: "{{ (named_pipes_raw | regex_replace('.*=','') | trim) }}"

# Values for NullSessionPipes:
# Empty string = Compliant (no named pipes accessible anonymously)
# Non-empty string = Non-compliant (one or more named pipes accessible anonymously)

- name: Decide audit result
  set_fact:
    audit_result_named_pipes: "{{ 'PASSED' if (current_named_pipes | length) == 0 else 'FAILED' }}"

- name: Display audit result
  debug:
    msg: "Audit result for 'Network access Named Pipes that can be accessed anonymously' on {{ inventory_hostname }}: {{ audit_result_named_pipes }} (Current value: {{ current_named_pipes | default('None') }})"

- name: Add header row to CSV (only once)
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "Server Name,Timestamp,OS,Version,IPAddress,Env,Control,Impact,Result,Current_value,Expected_value"
    create: yes
    insertafter: BOF
  run_once: true

- name: Write audit result to CSV
  local_action:
    module: lineinfile
    path: /tmp/test.csv
    line: "{{ ansible_fqdn }},{{ now(fmt='%Y-%m-%d %H:%M:%S') }},{{ ansible_os_name }},{{ ansible_distribution_version }},{{ inventory_hostname }},{{ env | default('N/A') }},Ensure 'Network access: Named Pipes that can be accessed anonymously' is configured (MS only),{{ impact | default('High') }},{{ audit_result_named_pipes }},{{ current_named_pipes | default('None') }},None"
    create: yes
